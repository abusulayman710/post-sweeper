<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="780" rx="42" fill="url(#bgGrad)" stroke="#2b3442" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Notch / Dynamic Island -->
  <rect x="140" y="24" width="120" height="24" rx="12" fill="#000000"/>
  <circle cx="238" cy="36" r="4" fill="#1c2430"/>

  <!-- Top App Bar -->
  <g transform="translate(30, 75)">
    <text x="0" y="18" fill="#ffffff" font-size="22" font-weight="700">Post Sweeper</text>
    <text x="0" y="38" fill="#8b949e" font-size="14">@privacy_enthusiast</text>
    <rect x="290" y="5" width="50" height="28" rx="8" fill="#1c2432"/>
    <text x="315" y="24" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">v3.0</text>
  </g>

  <!-- Main Status Card -->
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="340" height="235" rx="20" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.5"/>
    
    <!-- Status Dot & Phase -->
    <circle cx="20" cy="28" r="5" fill="#3fb950"/>
    <text x="35" y="33" fill="#ffffff" font-size="15" font-weight="600">Active (Background Pacing)</text>
    <text x="320" y="33" fill="#3fb950" font-size="12" font-weight="600" text-anchor="end">72%</text>

    <!-- Message -->
    <text x="20" y="58" fill="#8b949e" font-size="12">Verified tweet deletion confirmed by independent read</text>

    <!-- Progress Bar -->
    <rect x="20" y="75" width="300" height="8" rx="4" fill="#242c38"/>
    <rect x="20" y="75" width="216" height="8" rx="4" fill="url(#primaryGrad)"/>

    <!-- Progress Numbers -->
    <text x="20" y="105" fill="#c9d1d9" font-size="13" font-weight="500">1,024 of 1,420 verified deleted</text>
    <text x="320" y="105" fill="#8b949e" font-size="12" text-anchor="end">~18m left</text>

    <!-- Dry Run Switch Row -->
    <line x1="20" y1="125" x2="320" y2="125" stroke="#242c38" stroke-width="1"/>
    <text x="20" y="148" fill="#ffffff" font-size="13" font-weight="600">Dry Run Preview</text>
    <text x="20" y="166" fill="#8b949e" font-size="11">Simulate filters without deleting posts</text>
    
    <!-- Switch Control -->
    <rect x="280" y="142" width="40" height="22" rx="11" fill="#242c38"/>
    <circle cx="291" cy="153" r="8" fill="#8b949e"/>

    <!-- Action Buttons -->
    <rect x="20" y="185" width="145" height="38" rx="12" fill="#21262d"/>
    <text x="92" y="209" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Rescan Posts</text>

    <rect x="175" y="185" width="145" height="38" rx="12" fill="url(#primaryGrad)"/>
    <text x="247" y="209" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Sweep 396</text>
  </g>

  <!-- Metric Tiles -->
  <g transform="translate(30, 390)">
    <rect x="0" y="0" width="162" height="75" rx="16" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#8b949e" font-size="12">Will Delete</text>
    <text x="18" y="56" fill="#ffffff" font-size="22" font-weight="700">396</text>

    <rect x="178" y="0" width="162" height="75" rx="16" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.2"/>
    <text x="196" y="28" fill="#8b949e" font-size="12">Queued</text>
    <text x="196" y="56" fill="#e3b341" font-size="22" font-weight="700">42</text>
  </g>

  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="162" height="75" rx="16" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#8b949e" font-size="12">Verified Deleted</text>
    <text x="18" y="56" fill="#3fb950" font-size="22" font-weight="700">1,024</text>

    <rect x="178" y="0" width="162" height="75" rx="16" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.2"/>
    <text x="196" y="28" fill="#8b949e" font-size="12">Failed / Skipped</text>
    <text x="196" y="56" fill="#8b949e" font-size="22" font-weight="700">0</text>
  </g>

  <!-- Rate-Governor Brain Card -->
  <g transform="translate(30, 575)">
    <rect x="0" y="0" width="340" height="135" rx="18" fill="url(#cardGrad)" stroke="#242c38" stroke-width="1.2"/>
    <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="600">Rate-Limit Governor</text>
    
    <text x="20" y="58" fill="#8b949e" font-size="12">Current Window</text>
    <text x="320" y="58" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="end">28 / 50 ops (15 min)</text>

    <rect x="20" y="70" width="300" height="6" rx="3" fill="#242c38"/>
    <rect x="20" y="70" width="168" height="6" rx="3" fill="#e3b341"/>

    <text x="20" y="98" fill="#8b949e" font-size="12">Learned Rate Limit</text>
    <text x="320" y="98" fill="#3fb950" font-size="12" font-weight="600" text-anchor="end">Auto-Adapting</text>

    <text x="20" y="118" fill="#8b949e" font-size="12">Pacing Jitter</text>
    <text x="320" y="118" fill="#c9d1d9" font-size="12" text-anchor="end">35% Gaussian slack</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(30, 725)">
    <rect x="0" y="0" width="340" height="48" rx="24" fill="#141922" stroke="#242c38" stroke-width="1"/>
    <text x="50" y="30" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Dashboard</text>
    <text x="135" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Posts</text>
    <text x="215" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Filters</text>
    <text x="295" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Settings</text>
  </g>
</svg>
