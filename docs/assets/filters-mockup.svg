<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="primaryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="780" rx="42" fill="url(#bgGrad2)" stroke="#2b3442" stroke-width="3" filter="url(#shadow2)"/>
  
  <!-- Notch -->
  <rect x="140" y="24" width="120" height="24" rx="12" fill="#000000"/>
  <circle cx="238" cy="36" r="4" fill="#1c2430"/>

  <!-- Top App Bar -->
  <g transform="translate(30, 75)">
    <text x="0" y="20" fill="#ffffff" font-size="22" font-weight="700">Filter Rules</text>
    <text x="0" y="40" fill="#8b949e" font-size="13">Narrows down which posts to purge</text>
  </g>

  <!-- Section 1: Content Types -->
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="340" height="150" rx="18" fill="url(#cardGrad2)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#ffffff" font-size="14" font-weight="600">Target Content Types</text>
    
    <!-- Chip: Posts -->
    <rect x="18" y="44" width="85" height="34" rx="17" fill="#238636"/>
    <text x="60" y="66" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✔ Posts</text>

    <!-- Chip: Replies -->
    <rect x="110" y="44" width="90" height="34" rx="17" fill="#238636"/>
    <text x="155" y="66" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✔ Replies</text>

    <!-- Chip: Reposts -->
    <rect x="207" y="44" width="90" height="34" rx="17" fill="#238636"/>
    <text x="252" y="66" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✔ Reposts</text>

    <!-- Chip: Quotes -->
    <rect x="18" y="88" width="90" height="34" rx="17" fill="#238636"/>
    <text x="63" y="110" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">✔ Quotes</text>

    <!-- Chip: Likes (Unselected) -->
    <rect x="115" y="88" width="85" height="34" rx="17" fill="#21262d" stroke="#30363d"/>
    <text x="157" y="110" fill="#8b949e" font-size="12" font-weight="500" text-anchor="middle">Likes</text>
  </g>

  <!-- Section 2: Date Rules -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="340" height="130" rx="18" fill="url(#cardGrad2)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#ffffff" font-size="14" font-weight="600">Age &amp; Date Range</text>

    <text x="18" y="58" fill="#c9d1d9" font-size="13">Delete items older than</text>
    <text x="322" y="58" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="end">30 days</text>

    <rect x="18" y="72" width="304" height="6" rx="3" fill="#242c38"/>
    <rect x="18" y="72" width="90" height="6" rx="3" fill="#58a6ff"/>

    <text x="18" y="105" fill="#8b949e" font-size="12">Keep newest N items</text>
    <text x="322" y="105" fill="#8b949e" font-size="13" text-anchor="end">Off (0)</text>
  </g>

  <!-- Section 3: Engagement Protection -->
  <g transform="translate(30, 445)">
    <rect x="0" y="0" width="340" height="145" rx="18" fill="url(#cardGrad2)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#ffffff" font-size="14" font-weight="600">Engagement Protection</text>
    <text x="18" y="46" fill="#8b949e" font-size="11">Protects high-performing posts from being deleted</text>

    <text x="18" y="76" fill="#c9d1d9" font-size="13">Keep if Likes &gt;=</text>
    <text x="322" y="76" fill="#3fb950" font-size="13" font-weight="600" text-anchor="end">50 likes</text>

    <text x="18" y="106" fill="#c9d1d9" font-size="13">Keep if Reposts &gt;=</text>
    <text x="322" y="106" fill="#3fb950" font-size="13" font-weight="600" text-anchor="end">25 reposts</text>

    <text x="18" y="132" fill="#c9d1d9" font-size="13">Keep pinned post</text>
    <text x="322" y="132" fill="#3fb950" font-size="13" font-weight="600" text-anchor="end">Enabled</text>
  </g>

  <!-- Section 4: Keywords & Custom Lists -->
  <g transform="translate(30, 605)">
    <rect x="0" y="0" width="340" height="105" rx="18" fill="url(#cardGrad2)" stroke="#242c38" stroke-width="1.2"/>
    <text x="18" y="28" fill="#ffffff" font-size="14" font-weight="600">Keyword &amp; Keep-List Protection</text>

    <text x="18" y="58" fill="#8b949e" font-size="12">Exclude words</text>
    <text x="322" y="58" fill="#c9d1d9" font-size="12" text-anchor="end">None</text>

    <text x="18" y="85" fill="#8b949e" font-size="12">Protected Post IDs / Links</text>
    <text x="322" y="85" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="end">12 preserved</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(30, 725)">
    <rect x="0" y="0" width="340" height="48" rx="24" fill="#141922" stroke="#242c38" stroke-width="1"/>
    <text x="50" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Dashboard</text>
    <text x="135" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Posts</text>
    <text x="215" y="30" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Filters</text>
    <text x="295" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Settings</text>
  </g>
</svg>
