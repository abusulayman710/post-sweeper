<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="primaryGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="widgetCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#161b24"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="380" height="780" rx="42" fill="url(#bgGrad3)" stroke="#2b3442" stroke-width="3" filter="url(#shadow3)"/>
  
  <!-- Notch -->
  <rect x="140" y="24" width="120" height="24" rx="12" fill="#000000"/>
  <circle cx="238" cy="36" r="4" fill="#1c2430"/>

  <!-- Wallpaper Clock Header -->
  <g transform="translate(200, 120)">
    <text x="0" y="0" fill="#ffffff" font-size="48" font-weight="200" text-anchor="middle">09:41</text>
    <text x="0" y="24" fill="#8b949e" font-size="14" text-anchor="middle">Tuesday, October 24</text>
  </g>

  <!-- Title annotation -->
  <text x="200" y="195" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">Android Home Screen Glance Widgets</text>

  <!-- Widget 1: 4x2 Dashboard Widget -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="340" height="175" rx="28" fill="url(#widgetCard)" stroke="#2b3442" stroke-width="1.5" filter="url(#shadow3)"/>
    
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="6" fill="#3fb950"/>
      <text x="22" y="11" fill="#ffffff" font-size="15" font-weight="700">Post Sweeper</text>
      <text x="22" y="27" fill="#8b949e" font-size="11">Active  •  Pacing 42 ops / window</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="44" width="300" height="8" rx="4" fill="#242c38"/>
      <rect x="0" y="44" width="220" height="8" rx="4" fill="url(#primaryGrad3)"/>

      <text x="0" y="72" fill="#c9d1d9" font-size="12" font-weight="600">1,024 / 1,420 Deleted</text>
      <text x="300" y="72" fill="#3fb950" font-size="12" font-weight="700" text-anchor="end">72%</text>

      <!-- Widget Controls -->
      <rect x="0" y="90" width="145" height="36" rx="18" fill="#238636"/>
      <text x="72" y="113" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">⏸ Pause Sweep</text>

      <rect x="155" y="90" width="145" height="36" rx="18" fill="#21262d" stroke="#30363d"/>
      <text x="227" y="113" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Open App ↗</text>
    </g>
  </g>

  <!-- Widget 2: 2x2 Progress Tile -->
  <g transform="translate(30, 425)">
    <rect x="0" y="0" width="160" height="160" rx="28" fill="url(#widgetCard)" stroke="#2b3442" stroke-width="1.5" filter="url(#shadow3)"/>
    <g transform="translate(18, 20)">
      <text x="0" y="14" fill="#8b949e" font-size="12" font-weight="600">Sweep Status</text>
      <text x="0" y="45" fill="#3fb950" font-size="30" font-weight="800">72%</text>
      <text x="0" y="70" fill="#c9d1d9" font-size="11">1,024 Verified</text>
      
      <rect x="0" y="88" width="124" height="6" rx="3" fill="#242c38"/>
      <rect x="0" y="88" width="89" height="6" rx="3" fill="url(#primaryGrad3)"/>

      <text x="0" y="116" fill="#8b949e" font-size="10">~18m remaining</text>
    </g>
  </g>

  <!-- Widget 3: 2x2 Limits & Health Tile -->
  <g transform="translate(210, 425)">
    <rect x="0" y="0" width="160" height="160" rx="28" fill="url(#widgetCard)" stroke="#2b3442" stroke-width="1.5" filter="url(#shadow3)"/>
    <g transform="translate(18, 20)">
      <text x="0" y="14" fill="#8b949e" font-size="12" font-weight="600">Rate Governor</text>
      <text x="0" y="45" fill="#58a6ff" font-size="28" font-weight="800">Healthy</text>
      <text x="0" y="70" fill="#c9d1d9" font-size="11">Window: 28 / 50</text>
      <text x="0" y="92" fill="#8b949e" font-size="10">Limits hit: 0</text>
      <text x="0" y="116" fill="#3fb950" font-size="10" font-weight="600">✔ Zero 429 backoffs</text>
    </g>
  </g>

  <!-- Bottom App Icons Tray -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="55" height="55" rx="16" fill="#1c2430"/>
    <text x="27" y="34" fill="#8b949e" font-size="20" text-anchor="middle">📱</text>

    <rect x="80" y="0" width="55" height="55" rx="16" fill="#1c2430"/>
    <text x="107" y="34" fill="#8b949e" font-size="20" text-anchor="middle">✉</text>

    <rect x="160" y="0" width="55" height="55" rx="16" fill="#238636"/>
    <text x="187" y="34" fill="#ffffff" font-size="22" text-anchor="middle">🧹</text>

    <rect x="240" y="0" width="55" height="55" rx="16" fill="#1c2430"/>
    <text x="267" y="34" fill="#8b949e" font-size="20" text-anchor="middle">⚙</text>
  </g>

  <g transform="translate(50, 725)">
    <text x="187" y="10" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Post Sweeper</text>
  </g>
</svg>
